# Vaktar trunken: varje push till main och varje pull request måste lämna
# `npm run verify` grönt (enhetstester + BDD-scenarier), se README "Arbetssätt".
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 LTS: cucumber kräver 22 || 24 || >=26, och Node 20 är EOL.
          # Samma major som Dockerfile, så CI speglar driften.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enhetstester (TDD)
        run: npm test
      - name: BDD-scenarier (krav)
        run: npm run bdd

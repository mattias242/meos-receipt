<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#d93f3f" />
<title>Digitalt kvitto – MeOS</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header>
  <div class="topbar">
    <div class="bar-inner">
      <span class="brand">Digitalt kvitto</span>
    </div>
  </div>
  <div class="navbar">
    <div class="bar-inner">
      <span class="navText">Sträcktidsutläsning</span>
    </div>
  </div>
</header>

<main>
  <h1>Hämta ditt kvitto</h1>
  <p class="lead">Ange ditt SportIdent-nummer eller ditt namn, så visas din sträcktidsutläsning direkt i mobilen.</p>

  <form id="searchForm" autocomplete="off">
    <!-- KRAV-18: kommer löparen via tävlingens egen adress ska hon se att hon
         hamnat rätt, i stället för att välja i en lista hon inte behöver. -->
    <p id="cmpNamn" class="cmpNamn" hidden></p>
    <select id="cmpSelect" hidden aria-label="Välj tävling"></select>
    <div class="searchRow">
      <!-- Etiketten är dold för synen men läses av skärmläsare. En placeholder
           räcker inte: den läses inkonsekvent och försvinner när man skriver. -->
      <label for="query" class="visuallyHidden">SportIdent-nummer eller namn</label>
      <!-- KRAV-17: inget inputmode här. Sökningen tar både bricknummer och
           namn (KRAV-5), och iOS sifferknappsats saknar bokstäver helt – med
           inputmode="numeric" gick namnsökningen inte att använda i mobilen.
           Siffrorna kostar ett tryck på 123-tangenten; bokstäverna gick inte
           att nå alls. Autokorrigeringen är avstängd: den skriver om
           efternamn medan man skriver dem. -->
      <input id="query" type="text" enterkeyhint="search"
             autocorrect="off" spellcheck="false"
             placeholder="SportIdent-nummer eller namn" required />
      <button type="submit">Visa</button>
    </div>
  </form>

  <!-- Sidan uppdaterar sig själv var 15:e sekund; utan aria-live får den som
       använder skärmläsare aldrig veta att resultatet kommit. -->
  <div id="message" class="message" role="status" aria-live="polite" hidden></div>
  <ul id="hits" class="hits" hidden></ul>

  <article id="receipt" class="receipt" aria-live="polite" hidden></article>

  <!-- KRAV-22: löparens omdöme. Ligger utanför #receipt av två skäl: kvittot
       ritas om var 15:e sekund och rutan skulle nollställas vid varje
       uppdatering, och kvittot ska se likadant ut på skärm, i utskrift och i
       PDF – en fråga mitt i remsan hör inte hemma där. -->
  <section id="feedback" class="feedback" hidden>
    <h2 id="feedbackFraga" class="feedbackFraga">Var detta värdefullt för dig?</h2>
    <div class="feedbackKnappar" role="group" aria-labelledby="feedbackFraga">
      <button type="button" class="feedbackBtn" data-svar="upp" aria-label="Ja, det var värdefullt">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M2 20h3V9H2v11zm19.8-9.3c0-.9-.8-1.7-1.7-1.7h-5.4l.8-3.9v-.3c0-.4-.1-.7-.4-.9L14.2 3 8.6 8.6c-.3.3-.5.7-.5 1.2v8.5c0 .9.8 1.7 1.7 1.7h7.6c.7 0 1.3-.4 1.5-1l2.6-6c.1-.2.1-.4.1-.6v-1.7z" />
        </svg>
        <span>Ja</span>
      </button>
      <button type="button" class="feedbackBtn" data-svar="ner" aria-label="Nej, det var inte värdefullt">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M22 4h-3v11h3V4zM2.2 13.3c0 .9.8 1.7 1.7 1.7h5.4l-.8 3.9v.3c0 .4.1.7.4.9l.9.9 5.6-5.6c.3-.3.5-.7.5-1.2V5.7c0-.9-.8-1.7-1.7-1.7H6.6c-.7 0-1.3.4-1.5 1l-2.6 6c-.1.2-.1.4-.1.6v1.7z" />
        </svg>
        <span>Nej</span>
      </button>
    </div>
    <p id="feedbackTack" class="feedbackTack" role="status" aria-live="polite" hidden></p>
  </section>
</main>

<footer>
  Resultatdata via <a href="https://www.melin.nu/meos" target="_blank" rel="noopener">MeOS</a> onlineprotokoll.
</footer>

<script src="/app.js"></script>
</body>
</html>

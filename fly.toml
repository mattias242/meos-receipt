# fly.toml app configuration file for meos-receipt
app = "meos-receipt"
primary_region = "arn"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  RETENTION_DAYS = "90"

# MEOS_PASSWORD och MAILGUN_* sätts som secrets (fly secrets set), inte här –
# den här filen checkas in. Saknas Mailgun-uppgifterna startar tjänsten utan
# e-postutskick; kontrollera med /api/health efter deploy.

[[mounts]]
  source = "meos_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

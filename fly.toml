# fly.toml app configuration file for meos-receipt
app = "meos-receipt"
primary_region = "arn"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  RETENTION_DAYS = "90"
  # Flys proxy är ett hopp; utan detta ser takt-begränsaren proxyns adress
  # för alla löpare och fem mejlutskick låser hela tävlingen ute (KRAV-16).
  TRUST_PROXY = "1"
  READ_LIMIT = "1000"
  # Tävlingens tidszon; utan den kör maskinen UTC och kvittots "Uppdaterat"
  # visar en annan klocka än tävlingens tider.
  TZ = "Europe/Stockholm"

# MEOS_PASSWORD och MAILGUN_* sätts som secrets (fly secrets set), inte här –
# den här filen checkas in. Saknas Mailgun-uppgifterna startar tjänsten utan
# e-postutskick; kontrollera med /api/health efter deploy.

[[mounts]]
  source = "meos_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # All tävlingsdata hålls i minnet; filen på disk används bara vid start.
  # Mätt med 90 dagars data (60 tävlingar, ~57 000 löpare): 82 MB i vila och
  # 174 MB under last. 256 MB gav för liten marginal – slår det i taket
  # OOM-dödas maskinen mitt under tävlingen.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

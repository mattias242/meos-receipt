# fly.toml app configuration file for meos-receipt
app = "meos-receipt"
primary_region = "arn"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[[mounts]]
  source = "meos_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
